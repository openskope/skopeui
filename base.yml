services:
  web:
    build:
      context: app
      dockerfile: Dockerfile
    restart: always
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(3000, '127.0.0.1').on('connect', function () { process.exit(0) }).on('error', function () { process.exit(1) })"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
